<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAE Sensification</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Top bar: prompt + transport controls -->
    <header class="top-bar">
      <input id="prompt" type="text" placeholder="Enter prompt…" />
      <button id="btn-send" class="btn-send" disabled title="Restart generation with current prompt">↺</button>
      <button id="btn-prev"  class="btn-transport btn-prev"  disabled title="Previous token">⏮</button>
      <button id="btn-play"  class="btn-transport btn-play"  title="Play">▶</button>
      <button id="btn-pause" class="btn-transport btn-pause" disabled title="Pause">⏸</button>
      <button id="btn-stop"  class="btn-transport btn-stop"  disabled title="Stop">⏹</button>
      <button id="btn-next"  class="btn-transport btn-next"  disabled title="Next token">⏭</button>
    </header>

    <main class="main-layout">
      <!-- Left panel: controls -->
      <aside class="controls">

        <section class="control-group">
          <label>Model</label>
          <select id="model"></select>
        </section>

        <section class="control-group">
          <label>Layer</label>
          <select id="layer"></select>
        </section>

        <section class="control-group">
          <label>Width</label>
          <select id="width"></select>
        </section>

        <section class="control-group">
          <label class="control-label-row">
            Strategy
            <span class="help-icon" id="strategy-help" data-tooltip="">?</span>
          </label>
          <select id="strategy"></select>
        </section>

        <div id="clusters-group" class="hidden">
          <section class="control-group">
            <label>Clusters</label>
            <input id="clusters" type="number" min="2" max="128" value="8" />
          </section>
        </div>

        <section class="control-group">
          <label class="control-label-row">
            Max tokens
            <span class="help-icon" data-tooltip="Set to 0 for unlimited tokens.">?</span>
          </label>
          <input id="max-tokens" type="number" min="0" value="200" />
        </section>

        <section class="control-group">
          <label class="control-label-row">
            Mode
            <span class="help-icon" id="mode-help" data-tooltip="">?</span>
          </label>
          <select id="mode"></select>
        </section>

        <div id="bpm-group" class="hidden">
          <section class="control-group">
            <label class="control-label-row">
              BPM
              <span class="help-icon" data-tooltip="Beats per minute — controls how fast tokens are paced in timed mode. 60 BPM = 1 s/token, 120 BPM = 0.5 s/token.">?</span>
            </label>
            <input id="bpm" type="number" min="1" max="600" value="120" />
          </section>
        </div>

        <section class="control-group">
          <label class="checkbox-label">
            <input id="loop" type="checkbox" />
            Loop
          </label>
        </section>

        <section class="control-group">
          <label>Volume</label>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" />
        </section>

        <section class="control-group">
          <label class="checkbox-label">
            <input id="tonality-enabled" type="checkbox" checked />
            Semantic tonality
          </label>
        </section>

        <div id="tonality-controls">
          <section class="control-group">
            <label class="range-label">
              <span>Prompt blend</span>
              <span id="prompt-influence-value">20%</span>
            </label>
            <input id="prompt-influence" type="range" min="0" max="1" step="0.01" value="0.2" />
          </section>

          <section class="control-group">
            <label class="range-label">
              <span>Raw / interpreted</span>
              <span id="tonality-pitch-bias-value">55%</span>
            </label>
            <input id="tonality-pitch-bias" type="range" min="0" max="1" step="0.01" value="0.55" />
            <div class="mini-actions">
              <button id="btn-raw-sound" type="button">Raw</button>
              <button id="btn-interpreted-sound" type="button">Interpreted</button>
            </div>
          </section>

          <section class="control-group">
            <label class="control-label-row">
              Performance lenses
              <button id="btn-add-lens" class="mini-icon-btn" type="button" title="Add lens">+</button>
              <button id="btn-reset-lenses" class="mini-icon-btn" type="button" title="Reset lenses">↺</button>
            </label>
            <div id="tonality-lens-list"></div>
          </section>
        </div>

        <div id="status" class="status">
          <span id="status-text">Ready</span>
          <span id="loop-count-display" class="loop-counter hidden">Loop: 0</span>
        </div>
      </aside>

      <!-- Right panel: visualizations -->
      <section class="visuals">
        <div class="visuals-right">
          <div class="live-panels">
            <div id="cluster-viz-panel">
              <div id="cv-token-label">—</div>
              <div id="cv-color-strip"></div>
              <div id="cv-labels">
                <span id="cv-cluster-label">cluster: —</span>
                <span id="cv-feature-label">feature: —</span>
              </div>
              <canvas id="cluster-canvas"></canvas>
            </div>

            <div id="tonality-panel">
              <div class="tonality-header">
                <span>Semantic Tonality</span>
                <span id="tonality-state">idle</span>
              </div>
              <div id="tonality-primary">—</div>
              <div id="tonality-description">—</div>
              <div id="tonality-bars"></div>
              <div id="tonality-intervals"></div>
              <div id="tonality-memory"></div>
              <div id="tonality-evidence"></div>
              <div class="wave-panel">
                <canvas id="wave-canvas"></canvas>
              </div>
            </div>
          </div>
          <div id="cv-text-output">
            <div id="cv-text-content"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="main.js"></script>
</body>
</html>
